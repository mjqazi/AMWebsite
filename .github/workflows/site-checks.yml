name: Site checks

on:
  pull_request:
  push:
    branches: [master, codex/advancedmechanix-seo]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm run build:check
      - run: python tools/check_site.py
      - run: python tools/check_seo.py
      - run: node --check js/main.js
      - run: node --check js/cost-calculator.js
      - run: node --check sw.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify generated content is current
        run: |
          python tools/sync_snippets.py
          python tools/sync_seo.py
          python tools/sync_discovery.py
          python tools/sync_redirects.py
          git diff --exit-code
